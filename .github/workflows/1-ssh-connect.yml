
name: Lab 1 - SSH connection test

on:
  workflow_dispatch:

jobs:
  connect:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Show all files on the runner
        run: |
          echo "GitHub Actions Runner"
          whoami
          pwd
          ls -al

      - name: SSH into EC2 and run commands
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 10m
          script: |
            echo "Successfully connected to EC2"
            echo "Current user:"
            whoami

            echo "Current directory:"
            pwd

            echo "List files:"
            ls -al

            echo "Creating directory:"
            mkdir -p ~/prashant

            echo "GitHub Actions run number:"
            echo "${{ github.run_number }}"

            echo "Verify directory:"
            ls -ld ~/prashant

            echo "SSH connection test completed successfully"
